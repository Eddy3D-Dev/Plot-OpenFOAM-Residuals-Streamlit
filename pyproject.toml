[project]
name = "plot-openfoam-residuals"
version = "0.1.0"
description = "Streamlit app for plotting OpenFOAM residual .dat and .log files with interactive Altair and static Matplotlib views."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "altair>=5.5.0",
    "matplotlib>=3.10.7",
    "openfoam-residuals>=0.1.0",
    "pandas>=2.3.3",
    "streamlit>=1.51.0",
]

[dependency-groups]
dev = [
    "playwright>=1.58.0",
    "pytest>=9.0.2",
]
